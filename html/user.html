<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScenarijPro — Postavke korisničkog računa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="user.css" />
  </head>

  <body>
    <main class="wrap">
      <form class="card form" action="#" method="post" autocomplete="off">
        <header class="form-head">
          <h1>Postavke korisničkog računa</h1>
          <hr class="accent" />
          <p class="sub">
            <em
              >Upravljajte vašim korisničkim računom, sigurnosnim postavkama i
              notifikacijama.</em
            >
          </p>
        </header>

        <section class="section">
          <h2 class="section-title">Podaci o korisničkom računu</h2>

          <div class="field">
            <label for="fullName">Ime i prezime</label>
            <input
              id="fullName"
              name="fullName"
              type="text"
              placeholder="npr. John Doe"
            />
          </div>

          <div class="field">
            <label for="email">Email adresa</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="john.doe@example.com"
            />
          </div>

          <div class="field">
            <label for="perPage">Broj elemenata po stranici (1–100)</label>
            <input
              id="perPage"
              name="perPage"
              type="number"
              min="1"
              max="100"
              step="1"
              placeholder="25"
            />
          </div>
        </section>

        <section class="section warning">
          <h2 class="section-title">Sigurnosne postavke</h2>

          <div class="field">
            <label for="newPassword">Nova šifra</label>
            <input
              id="newPassword"
              name="newPassword"
              type="password"
              placeholder="********"
            />
            <p class="hint-text">
              Ostavite prazno ako ne želite mijenjati trenutnu šifru.
            </p>
          </div>

          <div class="field">
            <label class="checkbox-label" for="twofa">
              <input id="twofa" name="twofa" type="checkbox" />
              Omogući Two-Factor Authentication (2FA)
            </label>
          </div>
        </section>

        <section class="section notifications">
          <h2 class="section-title">Notifikacije</h2>

          <fieldset class="field radios">
            <legend>Preferirani način komunikacije</legend>
            <div class="radios-inline">
              <label>
                <input type="radio" name="contact" value="email" checked>
                Email
              </label>
              <label>
                <input type="radio" name="contact" value="sms">
                SMS
              </label>
              <label>
                <input type="radio" name="contact" value="none">
                Ništa
              </label>
            </div>
          </fieldset>

          <div class="field">
            <label for="freq">Učestalost notifikacija</label>
            <select id="freq" name="freq">
              <option value="daily" selected>Dnevno</option>
              <option value="weekly" selected>Sedmično</option>
              <option value="monthly" selected>Mjesečno</option>
              <option value="none" selected>Nikad</option>
            </select>
          </div>
        </section>

        <footer class="form-foot">
          <hr>
          <button class="btn-primary" type="submit">Spasi promjene</button>
        </footer>

      </form>
    </main>
  </body>
</html>
